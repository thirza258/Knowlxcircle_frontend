<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Served from public/, so it also resolves in the production build.
         /src/assets/... only works under the dev server. -->
    <link rel="icon" type="image/svg+xml" href="/knowlxcircle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
