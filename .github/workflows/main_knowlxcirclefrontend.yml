# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# NOTE: this repository has two independent deploy targets for the same app.
# This workflow deploys the built site to the Azure Web App 'knowlxcirclefrontend';
# vercel.json configures a separate Vercel deployment. Anything build-time
# (notably VITE_API_BASE_URL) has to be configured in BOTH places.

name: Build and deploy Node.js app to Azure Web App - knowlxcirclefrontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          # eslint 10 requires ^20.19.0 || ^22.13.0 || >=24 and vite 8 requires
          # ^20.19.0 || >=22.12.0. '20.x' would resolve to whatever patch the
          # runner image ships, which may be below 20.19.0 - so pin the 22 line.
          node-version: '22.x'
          cache: 'npm'

      # npm ci (not npm install): package-lock.json is committed, so this is
      # reproducible and fails loudly if the lockfile has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      # Runs before the build so a lint regression fails fast. The lint script uses
      # --max-warnings 0, which is the entire point of gating CI on it.
      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Vite inlines VITE_* variables into the bundle at BUILD time, so the API
          # base URL must be present here - it cannot be set on the running site.
          # Override it by defining the repository variable VITE_API_BASE_URL
          # (Settings > Secrets and variables > Actions > Variables); the fallback
          # is the production API the app has been pointing at so far.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://octopus-app-vcsp6.ondigitalocean.app/api/' }}
        run: npm run build

      # The old `zip release.zip ./* -r` packaged the whole checkout (node_modules
      # included) and silently skipped dotfiles. Only the built site is deployed;
      # zipping from inside dist puts index.html at the root of the package, which
      # is what the App Service static server expects to find in wwwroot.
      - name: Zip build output for deployment
        working-directory: dist
        run: zip -r ../release.zip . -x '.git/*' 'node_modules/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0D22468DFE364F51B004A35D172A1A12 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C17BAC166FD04B22B6EECC3996AA5056 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_520B50A081C84E0DBF3173273EF62807 }}

      # This is a client-side routed SPA: deep links such as /dashboard only work if
      # the host falls back to index.html for unknown paths. Vercel does that via the
      # rewrite in vercel.json; on Azure it depends on the App Service startup
      # command (e.g. `pm2 serve /home/site/wwwroot --no-daemon --spa`), which is
      # configured on the app itself and cannot be set from this workflow.
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'knowlxcirclefrontend'
          slot-name: 'Production'
          package: .
